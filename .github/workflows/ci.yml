name: AudioVibe CI/CD Quality Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop, 'feat/**', 'feat/*' ] # เพิ่มให้ครอบคลุมกิ่ง feat
  workflow_dispatch: # เพิ่มปุ่มกด Run workflow เองจากหน้าเว็บ

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==============================================================================
  # STAGE 1: STATIC CODE ANALYSIS & LINTING
  # ==============================================================================
  lint-and-format:
    name: "Stage 1: Lint & Code Style Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'apps/core-api/package-lock.json'

      - name: Check Backend Code Style & Lint (apps/core-api)
        # เปลี่ยนจาก: npm ci
        # เป็น:
        run: |
            cd apps/core-api
            npm install --no-audit
            npx oxlint || npm run lint --if-present

      - name: Check Frontend Code Style & Lint (apps/web)
        run: |
            cd apps/web
            npm install --no-audit
            npm run lint --if-present

      - name: Check Python Code Style (apps/ml-service)
        if: hashFiles('apps/ml-service/requirements.txt') != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Python Linters (if ML Service is populated)
        if: hashFiles('apps/ml-service/requirements.txt') != ''
        run: |
          pip install flake8 black
          flake8 apps/ml-service --count --select=E9,F63,F7,F82 --show-source --statistics || true

  # ==============================================================================
  # STAGE 2 & 3: BACKEND TEST, PRISMA MIGRATION & COVERAGE QUALITY GATE
  # ==============================================================================
  backend-test-and-coverage:
    name: "Stage 2 & 3: Backend Build, Vitest & Coverage"
    runs-on: ubuntu-latest
    needs: [lint-and-format]

    # Service Containers สำหรับรัน Integration Test กับ Database และ Cache จริง
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: audiovibe_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres@localhost:5432/audiovibe_db"
      REDIS_HOST: "localhost"
      REDIS_PORT: 6379
      REDIS_URL: "redis://localhost:6379"
      PORT: 3001
      SPOTIFY_CLIENT_ID: "ci_mock_spotify_client_id"
      SPOTIFY_CLIENT_SECRET: "ci_mock_spotify_client_secret"
      SPOTIFY_REDIRECT_URI: "http://127.0.0.1:3000/auth/spotify/callback"
      OPENROUTER_API_KEY: "ci_mock_openrouter_key"
      LLM_MODEL_NAME: "thudm/glm-5.3-flash"
      ML_SERVICE_URL: "http://localhost:8000"
      CORE_API_URL: "http://localhost:3001"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'apps/core-api/package-lock.json'

        # เปลี่ยนจาก: npm ci
        # เป็น:
      - name: Install Dependencies
        working-directory: apps/core-api
        run: npm install --no-audit

      - name: Generate Prisma Client & Run DB Migration
        run: |
          cd apps/core-api
          npx prisma generate
          npx prisma migrate deploy

      - name: Build TypeScript Project
        run: |
          cd apps/core-api
          npm run build

      - name: Run Vitest with v8 Coverage
        run: |
          cd apps/core-api
          npx vitest run --coverage

      - name: Archive Coverage Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: apps/core-api/coverage/
          retention-days: 14

  # ==============================================================================
  # STAGE 3 (PART B): ML SERVICE TESTS (FASTAPI / PYTEST)
  # ==============================================================================
  ml-service-test:
    name: "Stage 3: ML Recommendation Service Tests (Pytest)"
    runs-on: ubuntu-latest
    needs: [lint-and-format]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check if ML Service is ready
        id: check-ml
        run: |
          if [ -f "apps/ml-service/requirements.txt" ]; then
            echo "ml_ready=true" >> $GITHUB_OUTPUT
          else
            echo "ml_ready=false" >> $GITHUB_OUTPUT
            echo "ML Service is pending implementation. Skipping tests gracefully."
          fi

      - name: Setup Python 3.11
        if: steps.check-ml.outputs.ml_ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'apps/ml-service/requirements.txt'

      - name: Run Pytest & Measure Coverage
        if: steps.check-ml.outputs.ml_ready == 'true'
        run: |
          cd apps/ml-service
          pip install -r requirements.txt
          pip install pytest pytest-cov
          pytest --cov=. --cov-report=term-missing --cov-report=html

      - name: Archive ML Coverage Reports
        if: steps.check-ml.outputs.ml_ready == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-coverage-report
          path: apps/ml-service/htmlcov/
          retention-days: 14

  # ==============================================================================
  # STAGE 4: FRONTEND BUILD & PLAYWRIGHT E2E AUTOMATION TESTS
  # ==============================================================================
  frontend-e2e-test:
    name: "Stage 4: Frontend Build & Playwright E2E Tests"
    runs-on: ubuntu-latest
    needs: [lint-and-format]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      - name: Install Root Playwright Dependencies
        run: npm install --no-audit

      - name: Install Frontend Dependencies (apps/web)
        working-directory: apps/web
        run: npm install --no-audit

      - name: Build Next.js Frontend (apps/web)
        working-directory: apps/web
        run: npm run build

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Test Suite
        run: npm run test:e2e

      - name: Archive Playwright HTML Report & Traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # ==============================================================================
  # STAGE 5: QUALITY GATE & PR PROTECTION VERIFICATION
  # ==============================================================================
  quality-gate:
    name: "Quality Gate: CI Evaluation & Merge Approval"
    runs-on: ubuntu-latest
    needs: [backend-test-and-coverage, ml-service-test, frontend-e2e-test]
    if: always()
    steps:
      - name: Evaluate Pipeline Status
        run: |
          if [ "${{ needs.backend-test-and-coverage.result }}" != "success" ]; then
            echo "❌ Quality Gate Failed: Backend tests or build failed."
            exit 1
          fi

          if [ "${{ needs.ml-service-test.result }}" == "failure" ]; then
            echo "❌ Quality Gate Failed: ML Service tests failed."
            exit 1
          fi

          if [ "${{ needs.frontend-e2e-test.result }}" != "success" ]; then
            echo "❌ Quality Gate Failed: Frontend build or Playwright E2E tests failed."
            exit 1
          fi

          echo "✅ Quality Gate Passed: All unit, integration, and E2E tests passed successfully."
