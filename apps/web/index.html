<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AudioVibe Backend Console</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #101413; color: #e7f3ed; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top right, #173c2b, #101413 50%); }
    main { max-width: 1100px; margin: auto; padding: 32px 20px 60px; }
    h1 { margin-bottom: 6px; } .muted { color: #99b3a6; }
    .grid { display: grid; grid-template-columns: 1fr 1.4fr; gap: 18px; margin-top: 22px; }
    .card { background: #18211d; border: 1px solid #2c4539; border-radius: 16px; padding: 18px; box-shadow: 0 10px 30px #0003; }
    label { display: block; color: #a9c9ba; font-size: 13px; margin: 12px 0 5px; }
    input, button { width: 100%; box-sizing: border-box; border-radius: 9px; border: 1px solid #426653; padding: 11px; background: #0e1713; color: inherit; }
    button { margin-top: 14px; background: #1ed760; color: #07130c; border: 0; font-weight: 700; cursor: pointer; }
    button.secondary { background: #294538; color: #e7f3ed; } button:hover { filter: brightness(1.1); }
    .status { padding: 10px; border-radius: 9px; background: #10271c; color: #9ff0ba; margin-top: 14px; white-space: pre-wrap; }
    .results { display: grid; gap: 10px; margin-top: 14px; max-height: 520px; overflow: auto; }
    .track { display: grid; grid-template-columns: 58px 1fr auto; gap: 12px; align-items: center; padding: 9px; border-radius: 10px; background: #111a16; }
    .track img { width: 58px; height: 58px; object-fit: cover; border-radius: 7px; } .track strong { display: block; }
    .track small { color: #9bb5a8; } .track button { width: auto; margin: 0; padding: 8px 10px; }
    .check { display: flex; justify-content: space-between; border-bottom: 1px solid #294136; padding: 10px 0; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <h1>AudioVibe Backend Console</h1>
  <div class="muted">ตรวจสอบ Search, Track, Audio Features, Playlist และ Export ผ่าน Core API</div>
  <div class="grid">
    <section class="card">
      <h2>Progress</h2>
      <div class="check"><span>Search + DTO</span><span>✓</span></div>
      <div class="check"><span>Redis cache</span><span>✓</span></div>
      <div class="check"><span>Track persistence</span><span>✓</span></div>
      <div class="check"><span>Audio features</span><span>✓</span></div>
      <div class="check"><span>Playlist CRUD</span><span>✓</span></div>
      <div class="check"><span>Spotify export</span><span>✓</span></div>
      <label for="userId">Internal user ID</label>
      <input id="userId" value="a5d8adf6-3914-47ed-9969-30fad7e10e37" />
      <label for="query">Search query</label>
      <input id="query" value="lofi" />
      <button onclick="searchTracks()">Search Spotify</button>
      <button class="secondary" onclick="loadPlaylists()">Load my playlists</button>
      <div id="status" class="status">พร้อมตรวจสอบ</div>
    </section>
    <section class="card">
      <h2>Search results</h2>
      <div id="results" class="results"><div class="muted">กด Search Spotify เพื่อเริ่ม</div></div>
    </section>
  </div>
</main>
<script>
  const state = { tracks: [] };
  const $ = (id) => document.getElementById(id);
  function status(message) { $('status').textContent = message; }
  async function api(url, options) {
    const response = await fetch(url, options);
    const data = await response.json();
    if (!response.ok) throw new Error(data.message || `HTTP ${response.status}`);
    return data;
  }
  async function searchTracks() {
    try {
      status('กำลังค้นหา...');
      state.tracks = await api(`/playlists/search?userId=${encodeURIComponent($('userId').value)}&query=${encodeURIComponent($('query').value)}&limit=10`);
      $('results').innerHTML = state.tracks.map((track, index) => `<article class="track"><img src="${track.albumCoverUrl || ''}" alt=""><div><strong>${escapeHtml(track.title)}</strong><small>${escapeHtml(track.artistName)} · ${escapeHtml(track.albumName)}</small></div><button onclick="saveTrack(${index})">Save</button></article>`).join('');
      status(`ค้นพบ ${state.tracks.length} เพลง`);
    } catch (error) { status(`ผิดพลาด: ${error.message}`); }
  }
  async function saveTrack(index) {
    try {
      const name = prompt('ชื่อ Playlist', 'My AudioVibe Playlist');
      if (!name) return;
      const userId = $('userId').value;
      const playlists = await api(`/playlists?userId=${encodeURIComponent(userId)}`);
      let playlist = playlists.find((item) => item.name === name);
      if (!playlist) playlist = await api('/playlists', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ userId, name, isPublic: true }) });
      await api(`/playlists/${playlist.playlistId || playlist.id}/tracks`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ userId, tracks: [state.tracks[index]] }) });
      status(`บันทึก ${state.tracks[index].title} แล้ว`);
    } catch (error) { status(`ผิดพลาด: ${error.message}`); }
  }
  async function loadPlaylists() {
    try { const data = await api(`/playlists?userId=${encodeURIComponent($('userId').value)}`); $('results').innerHTML = data.map((p) => `<article class="track"><div></div><div><strong>${escapeHtml(p.name)}</strong><small>${p.tracks.length} tracks · average features ready</small></div></article>`).join('') || '<div class="muted">ยังไม่มี Playlist</div>'; status(`มี ${data.length} Playlist`); } catch (error) { status(`ผิดพลาด: ${error.message}`); }
  }
  function escapeHtml(value) { return String(value).replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char])); }
</script>
</body>
</html>
