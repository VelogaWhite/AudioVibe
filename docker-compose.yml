services:
  postgres:
    image: postgres:16-alpine
    container_name: audiovibe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-audiovibe_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-audiovibe_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - audiovibe-network

  redis:
    image: redis:7-alpine
    container_name: audiovibe-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - audiovibe-network

  ml-service:
    build:
      context: ./apps/ml-service
      dockerfile: Dockerfile
    container_name: audiovibe-ml-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-thudm/glm-5.3-flash}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\"" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - audiovibe-network

networks:
  audiovibe-network:
    name: audiovibe-network
    driver: bridge

volumes:
  postgres_data:
    name: audiovibe_postgres_data
  redis_data:
    name: audiovibe_redis_data
